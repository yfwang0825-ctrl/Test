<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兒童成長百分位與BMI計算機</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5a623;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            案 --text-color: #333333;
            --border-color: #cccccc;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h3 {
            margin-top: 20px;
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .form-group label {
            width: 150px;
            font-weight: bold;
        }

        .input-wrapper {
            width: 230px;
            display: flex;
            align-items: center;
        }

        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-group label {
            width: auto;
            font-weight: normal;
            cursor: pointer;
        }

        /* 全域結果紅框基礎設計 */
        .result-addon {
            width: 200px;
            margin-left: 20px;
            padding: 10px;
            background-color: #fff1f0;
            border: 2px solid #ff4d4f;
            /* 您要求的顯眼紅框 */
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;

            min-height: 20px;
            align-items: center;
            /* 【核心修正】初始狀態與重新計算時強制 100% 隱藏 */
            display: none;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }

        button.btn-calc {
            background-color: var(--primary-color);
            color: white;
        }

        button.btn-calc:hover {
            background-color: #357abd;
        }

        button.btn-reset {
            background-color: #6c757d;
            color: white;
        }

        button.btn-reset:hover {
            background-color: #5a6268;
        }

        .required::after {
            content: " *";
            color: red;
        }

        /* 針對小螢幕與手機版的最佳化排版 */
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .form-group {
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                margin-bottom: 15px;
            }

            .input-wrapper {
                width: 160px;
            }

            /* 1. 強制性別這一列絕對不准換行 */
            .form-group:first-of-type {
                flex-wrap: nowrap;
            }

            .form-group label {
                width: 100px;
                /* 原來 90px */
                margin-bottom: 0;
                flex-shrink: 0;
                /* 文字標籤絕對不允許被壓縮 */
            }

            /* 2. 【核心修正】確保性別的選項範圍在手機上不會被壓扁，且選項本身也不准斷行 */
            .form-group:first-of-type .input-wrapper {
                flex: none;
                /* 取消自動拉伸，改用固定寬度 */
                width: 150px;
                /* 給男孩女孩足夠的橫向寬度(原160px） */
            }

            .form-group:first-of-type .radio-group {
                white-space: nowrap;
                /* 【關鍵】強制單選鈕文字（男孩、女孩）絕對不准斷行 */
                display: flex;
                gap: 15px;
            }

            /* 3. 其他一般輸入框（身高、體重、頭圍）維持原本的填滿排版 */
            .form-group:not(:first-of-type) .input-wrapper {
                flex: 1;
                width: auto;
            }

            .result-addon {
                width: 100%;
                /* 強制結果紅框滿版斷行，移至下一行 */
                margin-left: 0;
                margin-top: 8px;
                box-sizing: border-box;
                display: none;
                /* 初始與重置時手機版同樣強制隱藏紅線 */
            }

            /* 讓百分位文字折行後，精準對齊上方的輸入框開頭，視覺最整齊 */
            #ageResult,
            #heightResult,
            #weightResult,
            #headCircumResult,
            #bmiResult {
                padding-left: 50px;
                /* 原102px */
            }
        }
    </style>

    <!-- 📌 專門用來單獨修正 iPad 西元日期偏上的小隱形修補區 -->
    <style>
        #adDate::-webkit-date-and-time-value {
            margin-top: 0px;
            margin-bottom: 0px;
            line-height: 40px;
            height: 40px;
        }
    </style>

</head>

<body>

    <div class="container">
        <h3>兒童成長百分位與BMI計算機</h3>

        <form id="growthForm" onsubmit="event.preventDefault(); calculateGrowth();">
            <!-- 性別 -->
            <div class="form-group">
                <label class="required">兒童性別</label>
                <div class="input-wrapper">
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="male" required> 男孩</label>
                        <label><input type="radio" name="gender" value="female"> 女孩</label>
                    </div>
                </div>
                <!-- 空白防排版錯位隱藏區塊 -->

            </div>

            <!-- 生日 -->
            <div class="form-group">
                <label class="required">出生日期</label>
                <!-- 📌 修改成西元/民國 雙用  -->
                <div style="
    display: inline-flex; 
    align-items: center; 
    white-space: nowrap; 
    vertical-align: middle;
    height: 40px;
    margin-left: 4px;         
">

                    <!-- 左側 Radio 區：📌 用 <span> 堆疊，完全免疫全域 label 寬度干擾！ -->
                    <div style="
        display: inline-flex; 
        flex-direction: column; 
        justify-content: center; 
        font-size: 16px;
        line-height: 1.2; 
        margin-right: 6px;
        flex-shrink: 0;
        width: auto;           /* 強制寬度自適應，不准被全域撐開 */
    ">
                        <!-- 西元（改用 span） -->
                        <span style="display: inline-flex; align-items: center; margin-bottom: 2px; cursor: pointer; width: auto;">
            <input type="radio" name="yearType" value="ad" checked style="margin: 0 3px 0 0; transform: scale(0.85); flex-shrink: 0;">西元
        </span>

                        <!-- 民國（改用 span） -->
                        <span style="display: inline-flex; align-items: center; cursor: pointer; width: auto;">
            <input type="radio" name="yearType" value="roc" style="margin: 0 3px 0 0; transform: scale(0.85); flex-shrink: 0;">民國
        </span>
                    </div>

                    <!-- 右側輸入框主體：標準 150px 寬度，高 32px   font-size:14px  -->
                    <div style="display: block; width: 160px; height: 40px; flex-shrink: 0;">
                        <!-- 西元輸入框 -->
                        <input type="date" id="adDate" style="width: 100%; box-sizing: border-box; height: 40px; font-size: 16px; padding: 0 4px;">

                        <!-- 民國輸入框群組 -->

            display: none; 
            align-items: center; 
            justify-content: space-between; 
            width: 100%; 
            box-sizing: border-box;
            height: 40px;            
        ">
                            <!-- 「年」輸入框：獨立灰色細框 -->
                            <input type="number" id="twYear" min="1" placeholder=" " style="
                width: 31%; text-align: center; height: 40px; box-sizing: border-box; font-size: 16px;
                border: 1px solid #ccc; border-radius: 4px; background-color: #fff; padding: 0;
            ">
                            <span style="font-size: 16px; color: #000; user-select: none; margin: 0 1px; width: auto !important;">年</span>

                            <!-- 「月」輸入框：獨立灰色細框 -->
                            <input type="number" id="twMonth" min="1" max="12" placeholder=" " style="
                width: 24%; text-align: center; height: 40px; box-sizing: border-box; font-size: 16px;
                border: 1px solid #ccc; border-radius: 4px; background-color: #fff; padding: 0;
            ">
                            <span style="font-size: 16px; color: #000; user-select: none; margin: 0 1px; width: auto !important;">月</span>

                            <!-- 「日」輸入框：獨立灰色細框 -->
                            <input type="number" id="twDay" min="1" max="31" placeholder=" " style="
                width: 24%; text-align: center; height: 40px; box-sizing: border-box; font-size: 16px;
                border: 1px solid #ccc; border-radius: 4px; background-color: #fff; padding: 0;
            ">
                            <span style="font-size: 16px; color: #000; user-select: none; margin: 0 0 0 1px; width: auto !important;">日</span>
                        </div>
                    </div>
                </div>

                <!-- 隱藏欄位 -->
                <input type="hidden" id="birthday" name="birthday">

                <div class="result-addon" id="ageResult"></div>
            </div>

            <!-- 身高 -->
            <div class="form-group">
                <label class="required">身高 (cm)</label>
                <div class="input-wrapper">
                    <input type="number" id="height" min="30" max="150" required>
                </div>
                <div class="result-addon" id="heightResult"></div>
            </div>

            <!-- 體重 -->
            <div class="form-group">
                <label class="required">體重 (kg)</label>
                <div class="input-wrapper">
                    <input type="number" id="weight" min="1" max="100" required>
                </div>
                <div class="result-addon" id="weightResult"></div>
            </div>

            <!-- 頭圍（加上專屬外框 ID，以利 3 歲以上完美執行完全隱藏與重新計算後自動出現） -->
            <div class="form-group" id="headCircumGroup">
                <label id="headCircumLabel" class="required">頭圍 (cm)</label>
                <div class="input-wrapper">
                    <input type="number" id="headCircum" min="30" max="60">
                </div>
                <div class="result-addon" id="headCircumResult"></div>
            </div>

            <!-- BMI 顯示與體位（預設隱藏） -->
            <div class="form-group" id="bmiFormGroup" style="display: none;">
                <label>BMI</label>
                <div class="input-wrapper">
                    <input type="number" id="bmiValue" readonly style="background-color: #fff1f0;
                     border: 2px solid #e74c3c; border-radius: 4px;font-weight: bold;"
                    >

            </div>

            <!-- 按鈕組 -->
            <div class="btn-group">
                <button type="button" class="btn-calc" onclick="calculateGrowth()" ontouchstart"">開始計算</button>
                <button type="button" class="btn-reset" onclick="resetForm()" ontouchstart"">重新計算</button>
            </div>
        </form>
    </div>

    <script>
        // 全域資料庫宣告
const growthData = {
// ==========================================
// 男孩 (Male) 0 ~ 7 歲官方原始數據
// ==========================================
male : {
    },

// ==========================================
// 女孩 (Female) 0 ~ 7 歲官方原始數據
// ==========================================
female : {
     }
};

// 1. 自動依輸入資料當天計算兒童的精準年齡
function calculateAge(birthdayStr) {
    // 關鍵修正：將 "2026-08-28" 強制轉換為 "2026/08/28"，徹底解除 iPad 日期地雷！
    const safeBirthdayStr = birthdayStr.replace(/-/g, '/');
    const birthDate = new Date(safeBirthdayStr);
    const today = new Date();
    
    // 檢查日期是否有效，防止 iPad 再次因異常數據卡死
    if (isNaN(birthDate.getTime())) return null;
    if (birthDate > today) return null;

    let years = today.getFullYear() - birthDate.getFullYear();
    let months = today.getMonth() - birthDate.getMonth();
    let days = today.getDate() - birthDate.getDate();

    if (days < 0) {
        months -= 1;
        const prevMonthLastDay = new Date(today.getFullYear(), today.getMonth(), 0).getDate();
        days += prevMonthLastDay;
    }
    if (months < 0) {
        years -= 1;
        months += 12;
    }
    
    const totalMonths = years * 12 + months;
    return { years, months, days, totalMonths };
}


// 2. 同步衛福部健康99之「就近靠攏」年齡階段算法 (月齡 Key 值校正回歸最終版)
function getAgeKey(age) {
    const totalMonths = age.totalMonths;
    
    // 0至5歲（0 ~ 60 個月）：維持逐月點對點查表
    if (totalMonths <= 60) {
        return totalMonths.toString();
    } 
    // 5至7歲（61 ~ 84 個月）：嚴格執行健康99網站「就近靠攏法」
    else if (totalMonths <= 84) {
        const currentYears = Math.floor(totalMonths / 12);
        const extraMonths = totalMonths % 12;

        if (currentYears === 5) {
            if (extraMonths <= 3) return "60";
            if (extraMonths === 4 || extraMonths === 5) return "66";
            if (extraMonths === 6) return "66";
            if (extraMonths >= 7 && extraMonths <= 9) return "66";
            if (extraMonths >= 10 && extraMonths <= 11) return "72";
        }
        else if (currentYears === 6) {
            if (extraMonths <= 3) return "72";
            if (extraMonths === 4 || extraMonths === 5) return "78";
            if (extraMonths === 6) return "78";
            if (extraMonths >= 7 && extraMonths <= 9) return "78";
            if (extraMonths >= 10 && extraMonths <= 11) return "84";
            }
            else if (currentYears === 7 && age.days === 0) return "84";
        }
    return "out_of_range";
}

// 監聽生日欄位變更，動態更新年齡、亮出年齡紅框與欄位隱顯狀態
function updateAgeDisplay() {
    const birthdayInput = document.getElementById('birthday').value;
    if (!birthdayInput) return;

    const age = calculateAge(birthdayInput);
    if (!age) {
        alert("生日不能晚於今天！");
        document.getElementById('birthday').value = "";
        return;
    }

    // 顯示實際年齡文字
    const ageRes = document.getElementById('ageResult');
    ageRes.innerText = `實際年齡：${age.years} 歲 ${age.months} 個月 ${age.days} 天`;
    ageRes.style.display = 'flex';
    ageRes.style.border = 'none';
    const headCircumInput = document.getElementById('headCircum');
    const headCircumLabel = document.getElementById('headCircumLabel');
    const headCircumGroup = document.getElementById('headCircumGroup');
    const bmiFormGroup = document.getElementById('bmiFormGroup');

    // 滿 3 歲 (36 個月) 以上完全隱藏頭圍
    if (age.totalMonths >= 36) {
        headCircumInput.required = false;
        headCircumLabel.classList.remove('required');
        headCircumGroup.style.display = 'none'; // 完全隱藏頭圍整行
    } else {
        headCircumInput.required = true;
        headCircumLabel.classList.add('required');
        headCircumGroup.style.display = 'flex'; // 重新顯示頭圍整行
        bmiFormGroup.style.display = 'none';   // 隱藏 BMI 輸入列
        
        // 隱藏 BMI 的結果紅框
        const bmiRes = document.getElementById('bmiResult');
        bmiRes.innerText = "";
        bmiRes.style.display = 'none';
        document.getElementById('bmiValue').value = "";
    }
}

// 檢查年齡是否超過7歲
function checkAge(){
    updateAgeDisplay();
    const birthdayInput = document.getElementById('birthday').value;
    const age = calculateAge(birthdayInput);
    const ageKey = getAgeKey(age);
    if (ageKey === "out_of_range") {
       // alert("本系統僅支援 0 至 7 歲兒童的數據評估。");
        setTimeout(() => {alert("本系統僅支援 0 至 7 歲兒童的數據評估。");}, 100); 
    }
}
// 3. 核心查表演算法：判斷六階百分位 (修正索引值)
function getPercentile(value, dataArray) {
    if (!value || !dataArray) return "-";
    const num = parseFloat(value);
    
    const p3  = dataArray[0]; // 3rd
    const p15 = dataArray[1]; // 15th
    const p50 = dataArray[2]; // 50th
    const p85 = dataArray[3]; // 85th
    const p97 = dataArray[4]; // 97th

    if (num < p3) return "小於 3";
    if (num >= p3 && num < p15) return "3 ～ 15";
    if (num >= p15 && num < p50) return "15 ～ 50";
    if (num >= p50 && num < p85) return "50 ～ 85";
    if (num >= p85 && num < p97) return "85 ～ 97";
    if (num >= p97) return "大於 97";
    return "-";
}

// 4. 3歲以上兒童 BMI 體位判斷 (修正索引值，對應 [5th, 15th, 50th, 85th, 97th])
function getBmiStatus(bmi, bmiArray) {
    if (!bmi || !bmiArray) return "-";
    const num = parseFloat(bmi);
    
    const p5  = bmiArray[0]; // 5th
    const p85 = bmiArray[3]; // 85th
    const p97 = bmiArray[4]; // 97th

    if (num < p5) return "過輕";
    if (num >= p5 && num < p85) return "正常";
    if (num >= p85 && num < p97) return "過重";
    if (num >= p97) return "肥胖";
    return "-";
}

// 5. 開始計算主程式
function calculateGrowth() {
    const genderElement = document.querySelector('input[name="gender"]:checked');
    const birthdayInput = document.getElementById('birthday').value;
    const heightInput = document.getElementById('height').value;
    const weightInput = document.getElementById('weight').value;
    const headCircumInput = document.getElementById('headCircum').value;

    if (!genderElement || !birthdayInput || !heightInput || !weightInput) {
        alert("請填寫所有必填欄位！");
        return;
    }

    const gender = genderElement.value;
    const age = calculateAge(birthdayInput);
    const ageKey = getAgeKey(age);

    if (ageKey === "out_of_range") {
        alert("本系統僅支援 0 至 7 歲兒童的數據評估。");
        return;
    }

    const currentTable = growthData[gender][ageKey];
    if (!currentTable) {
        alert("找不到對應年齡的對照資料，請確認資料庫是否載入成功。");
        return;
    }

    // 計算、填入文字並顯示【身高】紅框
    const hRes = document.getElementById('heightResult');
    hRes.innerText = "身高百分位：" + getPercentile(heightInput, currentTable.height) + " %";
    hRes.style.display = 'flex';

    // 計算、填入文字並顯示【體重】紅框
    const wRes = document.getElementById('weightResult');
    wRes.innerText = "體重百分位：" + getPercentile(weightInput, currentTable.weight) + " %";
    wRes.style.display = 'flex';

    // 計算、填入文字並顯示【頭圍】紅框（3歲以上則維持隱藏）
    const cRes = document.getElementById('headCircumResult');
    if (age.totalMonths >= 36 && !headCircumInput) {
        cRes.innerText = "";
        cRes.style.display = 'none';
    } else {
        cRes.innerText = "頭圍百分位：" + getPercentile(headCircumInput, currentTable.head) + " %";
        cRes.style.display = 'flex';
    }

    // 處理 3 歲以上的 【BMI 與體位判斷】
    if (age.totalMonths >= 36) {
        const hMeter = parseFloat(heightInput) / 100;
        const bmi = (parseFloat(weightInput) / (hMeter * hMeter)).toFixed(1);
        bmiFormGroup.style.display = 'flex';    // 顯示 BMI 欄位
        document.getElementById('bmiValue').value = bmi;
        
        const bRes = document.getElementById('bmiResult');
        bRes.innerText = "體位判斷：" + getBmiStatus(bmi, currentTable.bmi);
        bRes.style.display = 'flex';
    }
}

// 6. 條件9：重新計算按鈕，清除所有資料並100%還原初始狀態
function resetForm() {
    // 清空所有表單輸入
    document.getElementById('growthForm').reset();
    
    // 將所有結果文字完全清空
    document.getElementById('ageResult').innerText = "";
    document.getElementById('heightResult').innerText = "";
    document.getElementById('weightResult').innerText = "";
    document.getElementById('headCircumResult').innerText = "";
    document.getElementById('bmiValue').value = "";
    document.getElementById('bmiResult').innerText = "";
    
    // 將所有結果紅框再度隱藏
    document.getElementById('ageResult').style.display = 'none';
    document.getElementById('heightResult').style.display = 'none';
    document.getElementById('weightResult').style.display = 'none';
    document.getElementById('headCircumResult').style.display = 'none';
    document.getElementById('bmiResult').style.display = 'none';
    
    // 【純淨精簡控制】一鍵強制讓頭圍外框重新出現，並恢復必填紅星
    document.getElementById('headCircumGroup').style.display = 'flex';
    document.getElementById('bmiFormGroup').style.display = 'none';
    
    document.getElementById('headCircum').required = true;
    document.getElementById('headCircumLabel').classList.add('required');
    // 1. 將 Radio 按鈕自動勾回「西元」
const defaultRadio = document.querySelector('input[name="yearType"][value="ad"]');
if (defaultRadio) defaultRadio.checked = true;

// 2. 清空西元輸入框的值，並讓它顯示出來
const adDateInput = document.getElementById('adDate');
if (adDateInput) {
    adDateInput.value = '';
    adDateInput.style.display = 'inline-block';
}

// 3. 清空民國年、月、日三個格子的值，並把整個民國區塊隱藏
const rocContainer = document.getElementById('rocContainer');
if (rocContainer) rocContainer.style.display = 'none';

<!-- 5. 控制顯示與自動換算的 JavaScript -->
// ─── 區塊 A：控制「西元/民國」欄位的顯示與隱藏 ───
document.querySelectorAll('input[name="yearType"]').forEach(radio => {
    radio.addEventListener('change', function() {
        const adDateInput = document.getElementById('adDate');
        const rocContainer = document.getElementById('rocContainer');
        
        if (this.value === 'ad') {
            adDateInput.style.display = 'inline-block'; // 顯示西元
            rocContainer.style.display = 'none';         // 隱藏民國
            // 切換時清空數據，避免干擾
            document.getElementById('birthday').value = adDateInput.value; 
        } else {
            adDateInput.style.display = 'none';          // 隱藏西元
            rocContainer.style.display = 'inline-flex';  // 顯示民國
            updateRocToAd(); // 觸發一次民國年換算
        }
        checkAge(); // 切換時自動重算年齡
    });
});

// ─── 區塊 B：監聽「西元」輸入框 ───
document.getElementById('adDate').addEventListener('input', function() {
    document.getElementById('birthday').value = this.value; // 直接複製西元日期
    checkAge(); // 啟動你的年齡計算
});

// ─── 區塊 C：監聽「民國」三個格子（全域監聽） ───
document.querySelectorAll('#twYear, #twMonth, #twDay').forEach(input => {
    input.addEventListener('input', updateRocToAd);
});

// ─── 區塊 D：民國轉西元的專用 Function ───
function updateRocToAd() {
    // 只有在目前勾選「民國」時才進行換算
    if (document.querySelector('input[name="yearType"]:checked').value !== 'roc') return;

    const twYear = parseInt(document.getElementById('twYear').value) || 0;
    const month = document.getElementById('twMonth').value.padStart(2, '0');
    const day = document.getElementById('twDay').value.padStart(2, '0');

    if (twYear > 0 && month !== '00' && day !== '00') {
        const westernYear = twYear + 1911;
        const finalDate = `${westernYear}-${month}-${day}`;
        
        document.getElementById('birthday').value = finalDate; // 塞入隱藏欄位
        checkAge(); // 啟動你的年齡計算
    }
}
       
    </script>
